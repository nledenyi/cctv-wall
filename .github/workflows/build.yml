name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run dist

      # latest.yml and the blockmap are the update feed: electron-updater reads
      # the first to find out a version exists and the second to download only
      # the parts that changed. They are written because a publish provider is
      # configured, not because anything is published, so if-no-files-found
      # failing here is the check that the config is still in place.
      - uses: actions/upload-artifact@v7
        with:
          name: cctv-wall-windows
          path: |
            release/*.exe
            release/*.zip
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error

      # a tag is a release, everything else is just an artifact to download
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.exe
            release/*.zip
            release/latest.yml
            release/*.blockmap
          generate_release_notes: true
